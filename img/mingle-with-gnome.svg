<svg id="background" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Neglected Gnome Expo — Mingle Map</title>
  <desc id="desc">Illustrated overhead expo garden with four interactive locations: Tea Grove, Tinker Terrace, Story Circle, and Moonlight Music.</desc>
  <defs>
    <linearGradient id="grass" x2="0" y2="1"><stop stop-color="#e5e5c4"/><stop offset="1" stop-color="#b6c99a"/></linearGradient>
    <pattern id="grass-dots" width="54" height="44" patternUnits="userSpaceOnUse"><circle cx="12" cy="11" r="2" fill="#6d8a59" opacity=".3"/><path d="M37 30l4 -7m-3 6l-6 -3" stroke="#668258" stroke-width="2" opacity=".3"/></pattern>
    <filter id="shadow" x="-30%" y="-35%" width="160%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#2c3824" flood-opacity=".28"/></filter>
    <symbol id="tea-grove" viewBox="-95 -92 190 184">
      <ellipse cy="56" rx="80" ry="23" fill="#3d4a30" opacity=".15"/>
      <path d="M-69 12 Q-86 -45 -38 -68 Q5 -92 42 -62 Q86 -35 67 15Z" fill="#517452" stroke="#314e3d" stroke-width="5"/>
      <path d="M-60 -4 Q-71 -40 -35 -57 Q5 -77 39 -47 Q66 -27 57 2" fill="none" stroke="#94b583" stroke-width="7"/>
      <ellipse cy="27" rx="49" ry="25" fill="#7a4831" stroke="#563a2d" stroke-width="5"/>
      <ellipse cy="19" rx="43" ry="19" fill="#d8ae77" stroke="#6b4932" stroke-width="4"/>
      <path d="M-6 15v-18h22v18M16 1q21 -10 21 5q-1 9 -21 6" fill="#ab693b" stroke="#563824" stroke-width="4"/>
      <circle cx="-25" cy="16" r="7" fill="#f0e3b3" stroke="#795b45" stroke-width="3"/><circle cx="32" cy="25" r="6" fill="#f0e3b3" stroke="#795b45" stroke-width="3"/>
      <path d="M-28 40v24M26 41v22" stroke="#533a2d" stroke-width="6"/>
    </symbol>
    <symbol id="tinker-terrace" viewBox="-95 -92 190 184">
      <ellipse cy="62" rx="84" ry="18" fill="#3d4a30" opacity=".16"/>
      <path d="M-76 -10L0 -67 77 -10v65H-76Z" fill="#b16e48" stroke="#5f4435" stroke-width="6"/>
      <path d="M-87 -8L0 -79 88 -8" stroke="#684538" stroke-width="15" fill="none" stroke-linejoin="round"/>
      <path d="M-58 2h34v27h-34zM25 2h34v27H25z" fill="#d7be8e" stroke="#634a35" stroke-width="5"/>
      <path d="M-16 55V13h32v42" fill="#49392d" stroke="#e1c58a" stroke-width="5"/>
      <circle cx="0" cy="-18" r="22" fill="#d3a450" stroke="#624932" stroke-width="5"/><circle cx="0" cy="-18" r="9" fill="#675c44"/>
      <path d="M0 -47v-9M0 10v-9M-30 -18h9M21 -18h9M-21 -39l7 7M14 -4l7 7M21 -39l-7 7M-14 -4l-7 7" stroke="#d3a450" stroke-width="7"/>
    </symbol>
    <symbol id="story-circle" viewBox="-95 -92 190 184">
      <ellipse cy="54" rx="78" ry="22" fill="#3d4a30" opacity=".16"/>
      <ellipse cy="24" rx="72" ry="46" fill="#ba986f" stroke="#79543c" stroke-width="6"/>
      <path d="M-50 7q50 -32 100 0M-50 41q50 29 100 0" stroke="#d8bd94" stroke-width="4" fill="none"/>
      <path d="M-18 -52q18 -12 36 0v66q-18 -12 -36 0z" fill="#e8d8b0" stroke="#684832" stroke-width="5"/>
      <path d="M0 -52v65M-11 -35h7M4 -32h8M-11 -19h7M4 -16h8" stroke="#8b6549" stroke-width="3"/>
      <g fill="#6a4839" stroke="#4b352a" stroke-width="3"><circle cx="-60" cy="8" r="11"/><circle cx="61" cy="8" r="11"/><circle cx="-34" cy="58" r="11"/><circle cx="36" cy="58" r="11"/></g>
    </symbol>
    <symbol id="moonlight-music" viewBox="-95 -92 190 184">
      <ellipse cy="61" rx="83" ry="19" fill="#3d4a30" opacity=".17"/>
      <path d="M-72 48v-67L0 -68 72 -19v67z" fill="#6b5572" stroke="#433c4c" stroke-width="6"/>
      <path d="M-80 -17L0 -80 80 -17" fill="none" stroke="#b58b57" stroke-width="13" stroke-linejoin="round"/>
      <path d="M-48 48V1h96v47" fill="#c28e61" stroke="#4d3940" stroke-width="5"/>
      <circle cx="0" cy="-35" r="16" fill="#f5d99e"/><circle cx="7" cy="-39" r="14" fill="#6b5572"/>
      <path d="M-30 36v-41l23 -6v37M-30 1l23 -6" stroke="#2c3033" stroke-width="6" fill="none"/>
      <ellipse cx="-37" cy="40" rx="13" ry="8" fill="#2c3033"/><ellipse cx="-14" cy="30" rx="12" ry="8" fill="#2c3033"/>
      <path d="M23 4v-32l21 -6v27" stroke="#e8c576" stroke-width="5" fill="none"/><ellipse cx="18" cy="9" rx="10" ry="6" fill="#e8c576"/><ellipse cx="39" cy="-4" rx="10" ry="6" fill="#e8c576"/>
    </symbol>
    <!-- Gnome character, origin at the feet (0,0), suitable for movement along paths -->
    <symbol id="walking-gnome" viewBox="-32 -83 64 88">
      <ellipse cx="0" cy="0" rx="20" ry="5" fill="#3b4030" opacity=".25"/>
      <!-- boots and legs -->
      <path d="M-13 -22L-12 -5H-1L-1 -22M5 -22L6 -5H17L14 -23" fill="#62513d" stroke="#493b30" stroke-width="2"/>
      <path d="M-14 -7h14v8h-18q-3 -4 4 -8M5 -7h13q8 8 -1 8H4Z" fill="#50372c" stroke="#302823" stroke-width="2"/>
      <!-- tunic and arms -->
      <path d="M-15 -46Q0 -55 16 -46L19 -19H-20Z" fill="#63754d" stroke="#394735" stroke-width="3"/>
      <path d="M-15 -43L-26 -28L-21 -23L-8 -36M14 -43L26 -28L21 -23L8 -36" fill="#63754d" stroke="#394735" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-19 -25H18" stroke="#b8864b" stroke-width="4"/>
      <circle cx="-1" cy="-25" r="3" fill="#d6b15f"/>
      <!-- face and ears -->
      <path d="M-13 -62q-10 -5 -13 0q5 12 15 9M13 -62q10 -5 13 0q-5 12 -15 9" fill="#e8b68e" stroke="#9b6b50" stroke-width="2"/>
      <ellipse cx="0" cy="-56" rx="16" ry="17" fill="#e9bb95" stroke="#9b6b50" stroke-width="2"/>
      <circle cx="-6" cy="-57" r="2" fill="#302b28"/><circle cx="6" cy="-57" r="2" fill="#302b28"/>
      <path d="M-7 -49q7 5 14 0" fill="none" stroke="#825f50" stroke-width="2" stroke-linecap="round"/>
      <ellipse cy="-53" rx="4" ry="5" fill="#d99d78"/>
      <!-- iconic pointed cap -->
      <path d="M-19 -67Q-10 -89 5 -82Q18 -76 20 -66Z" fill="#a54c3d" stroke="#68352e" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-19 -66Q0 -71 20 -66" fill="none" stroke="#cf8060" stroke-width="5" stroke-linecap="round"/>
    </symbol>
    <g id="tree"><circle r="24" fill="#476b4d" stroke="#34543d" stroke-width="5"/><circle cx="-9" cy="-9" r="12" fill="#7d9b65" opacity=".8"/><circle cx="11" cy="8" r="11" fill="#6f9162" opacity=".65"/></g>
  </defs>

  <!-- Fixed scenic background; not animated -->
  <rect width="1280" height="720" fill="url(#grass)"/>
  <rect width="1280" height="720" fill="url(#grass-dots)"/>
  <path d="M0 93Q250 17 458 93T886 97T1280 51V0H0Z" fill="#8da6a0" opacity=".35"/>
  <path d="M0 634Q330 561 564 631T1280 599V720H0Z" fill="#728f6d" opacity=".35"/>
  <path d="M-30 354C150 315 241 421 398 367S637 282 763 342S1084 430 1315 337" fill="none" stroke="#ad9775" stroke-width="83" stroke-linecap="round"/>
  <path d="M-30 354C150 315 241 421 398 367S637 282 763 342S1084 430 1315 337" fill="none" stroke="#e9d8b3" stroke-width="69" stroke-linecap="round" stroke-dasharray="3 13"/>
  <path d="M313 80Q376 179 319 282T333 523Q358 620 318 720" fill="none" stroke="#ad9775" stroke-width="58"/>
  <path d="M313 80Q376 179 319 282T333 523Q358 620 318 720" fill="none" stroke="#e9d8b3" stroke-width="46"/>
  <path d="M953 0Q909 158 970 275T947 522Q924 635 992 720" fill="none" stroke="#ad9775" stroke-width="58"/>
  <path d="M953 0Q909 158 970 275T947 522Q924 635 992 720" fill="none" stroke="#e9d8b3" stroke-width="46"/>
  <g opacity=".93"><use href="#tree" x="98" y="135"/><use href="#tree" x="166" y="86"/><use href="#tree" x="557" y="112"/><use href="#tree" x="727" y="100"/><use href="#tree" x="1166" y="118"/><use href="#tree" x="1206" y="575"/><use href="#tree" x="734" y="612"/><use href="#tree" x="525" y="565"/><use href="#tree" x="136" y="589"/><use href="#tree" x="84" y="523"/></g>
  <g fill="#f3e7c8" stroke="#807153" stroke-width="3"><rect x="529" y="300" width="220" height="100" rx="48"/><rect x="561" y="327" width="155" height="44" rx="22" fill="#d6b985"/></g>
  <g font-family="Georgia,serif" text-anchor="middle" fill="#3d382f"><text x="640" y="54" font-weight="bold" font-size="32">THE MINGLE GROUNDS</text><text x="640" y="78" font-size="14" letter-spacing="3">NEGLECTED GNOME EXPO</text></g>

  <!-- Four JavaScript-targetable instances. Animate/highlight these <use> elements. -->
  <g class="locations" filter="url(#shadow)">
    <use id="location-tea" class="mingle-location" href="#tea-grove" x="110" y="145" width="190" height="184" tabindex="0" role="button" aria-label="Tea Grove"/>
    <use id="location-tinker" class="mingle-location" href="#tinker-terrace" x="988" y="139" width="190" height="184" tabindex="0" role="button" aria-label="Tinker Terrace"/>
    <use id="location-story" class="mingle-location" href="#story-circle" x="111" y="425" width="190" height="184" tabindex="0" role="button" aria-label="Story Circle"/>
    <use id="location-music" class="mingle-location" href="#moonlight-music" x="988" y="424" width="190" height="184" tabindex="0" role="button" aria-label="Moonlight Music"/>
  </g>
  <!-- Gnome starts on the central path. Move #gnome-position with JS; keep <use> reusable. -->
  <g id="gnome-position" transform="translate(640 397)" aria-label="Gnome explorer">
    <g id="gnome-direction">
      <use id="gnome-character" href="#walking-gnome" x="-32" y="-83" width="64" height="88"/>
    </g>
  </g>
  <g text-anchor="middle" fill="#362d28" font-family="Georgia,serif" font-weight="bold" font-size="20">
    <text x="205" y="339">Tea Grove</text><text x="1083" y="333">Tinker Terrace</text><text x="206" y="627">Story Circle</text><text x="1083" y="626">Moonlight Music</text>
  </g>
  <style>
    .mingle-location { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: opacity .25s ease, filter .25s ease, transform .25s ease; }
    .mingle-location:hover, .mingle-location:focus-visible { filter: brightness(1.17) drop-shadow(0 0 9px #ffe4a0); transform: scale(1.055); outline: none; }
    .mingle-location.is-active { filter: brightness(1.16) drop-shadow(0 0 13px #f8c950); transform: scale(1.09); }
    .locations:has(.is-active) .mingle-location:not(.is-active) { opacity: .42; }
    @media (prefers-reduced-motion: reduce) { .mingle-location { transition: none; } }
  </style>
</svg>
